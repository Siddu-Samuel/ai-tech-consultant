server {
  listen 80;
  location /api/knowledge/ { rewrite ^/api/knowledge/(.*)$ /$1 break; proxy_pass http://knowledge-brain:8001; }
  location /api/inbox/ { rewrite ^/api/inbox/(.*)$ /$1 break; proxy_pass http://inbox-agent:8002; }
  location /api/scopes { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://meeting-to-scope:8003; }
  location / { root /usr/share/nginx/html; index index.html; try_files $uri $uri/ /index.html; }
}
